<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SkyLapse — 16 years of the infrared sky</title>
    <meta name="description" content="Watch 16 years of the infrared sky (WISE + SPHEREx) and catch what moves." />
    <meta property="og:title" content="SkyLapse — watch 16 years of the infrared sky" />
    <meta property="og:description" content="WISE/NEOWISE + SPHEREx joined into one movie of any patch of sky, so nearby brown dwarfs visibly move." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0E131C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // set the theme before first paint (stored choice, else system setting)
      (function () { var t = null; try { t = localStorage.getItem("skylapse.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t; })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
